<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>إهداء عبر واتساب</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Tahoma, Arial;
            background: #f1f8f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            background: #fff;
            width: 420px;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
            text-align: center;
        }
        
        h1 {
            color: #25D366;
            margin-bottom: 20px
        }
        
        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 15px;
            box-sizing: border-box
        }
        
        textarea {
            min-height: 220px;
            background: #f9f9f9;
        }
        
        a.button {
            display: block;
            background: #25D366;
            color: #fff;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 17px
        }
        
        .note {
            font-size: 12px;
            color: #777;
            margin-top: 10px
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>إهداء عبر واتساب 💚</h1>

        <!-- الخانات -->
        <input id="donor" placeholder="اسم المتبرع">
        <input id="phone" placeholder="رقم واتساب (9665xxxxxxxx)">

        <!-- النص الثابت -->
        <textarea id="message" readonly></textarea>

        <a class="button" href="#" onclick="this.href=sendWhatsApp()">إرسال الإهداء</a>

        <div class="note">
            أدخل الرقم بدون + أو مسافات
        </div>
    </div>

    <script>
        function sendWhatsApp() {
            let donor = document.getElementById('donor').value.trim();
            let phone = document.getElementById('phone').value.trim();

            if (!donor || !phone) {
                alert('الرجاء إدخال اسم المتبرع ورقم الواتساب');
                return '#';
            }

            phone = phone.replace(/\D/g, '');

            let text =
                `صدقة جارية تلقاها يوم العرض تنال بها شفاعة هذا الكتاب العظيم
فجزاكم الله خيرًا لدعمكم وجعل لكم بمثل أجر متعلم كتاب الله
فهي التجارة التي لا تبور

فدعمكم استمرار لخيرية هذه الأمة بتعليم كتاب الله
بين الهدايا الزائلة، ${donor} هدية خالدة..
سهم في الخير، باسمك، ليظل أثره صدقة جارية
بتعليم كتاب الله لطلاب الجمعية الخيرية لتحفيظ القرآن الكريم بالحريق`;

            document.getElementById('message').value = text;

            return 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text);
        }
    </script>

</body>

</html>
